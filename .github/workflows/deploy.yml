name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build API
        run: |
          docker build -t ashutoshmall/talentlens-api:latest -f apps/api/Dockerfile .
          docker push ashutoshmall/talentlens-api:latest

      - name: Build Web
        run: |
          docker build -t ashutoshmall/talentlens-web:latest -f apps/web/Dockerfile .
          docker push ashutoshmall/talentlens-web:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/TalentLens
            docker image prune -af
            docker builder prune -af
            docker compose pull
            docker compose up -d --force-recreate
